name: Link Health

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 4d-seismic-hub-link-health
  cancel-in-progress: true

jobs:
  lychee:
    name: Scheduled external-link diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run Lychee link checker
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,403,429
            --retry-wait-time 5
            --max-retries 3
            --exclude "\{\{.*\}\}"
            --exclude ".*onepetro.org.*"
            .
