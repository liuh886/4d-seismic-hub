name: Validate Site

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.md"
      - "**/*.html"
      - "**/*.rb"
      - "**/*.sh"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.css"
      - "Gemfile"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Evidence contract and Jekyll build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate case-study evidence contract
        run: ruby tests/validate_case_studies.rb

      - name: Validate community review wiring
        run: bash tests/community_debate_check.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
