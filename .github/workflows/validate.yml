name: Validate Site

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.md"
      - "**/*.html"
      - "**/*.rb"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.css"
      - "Gemfile"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Schema and Jekyll build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate case-study schema
        run: ruby tests/validate_case_studies.rb

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
